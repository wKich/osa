# OpenCode + Kimi coding plan provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f opencode-oss/providers/opencode-kimi-for-coding.yaml
#   openshell profile import -f opencode-oss/providers/opencode-kimi-for-coding.yaml --global
#
# Then create the provider instance from your host environment:
#   KIMI_API_KEY=<key> openshell provider create \
#     --name opencode-kimi-for-coding --type opencode-kimi-for-coding --from-existing
#
# The profile authorizes only /usr/local/bin/opencode (the path used by
# opencode-oss/image) to reach api.kimi.ai, and binds KIMI_API_KEY to that
# endpoint. OpenCode calls this endpoint kimi-code-plan-global. Its
# kimi-code-plan-cn provider reads the same KIMI_API_KEY, but the CN host
# (api.kimi.com) is not in this profile and needs its own. Do not set KIMI_BASE_URL in the sandbox: a different base URL would leave the
# credential unbound.

id: opencode-kimi-for-coding
display_name: OpenCode (Kimi For Coding)
description: Kimi coding plan inference API for the OpenCode coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Kimi API key
    env_vars: [KIMI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.kimi.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/opencode
