# Template provider profile for OpenShell.
#
# This is a valid, inert profile: it lints cleanly and grants nothing useful
# until you replace the placeholders. `opencode-oss provider setup` fills it for
# custom providers and writes the result to
# ${XDG_CONFIG_HOME:-$HOME/.config}/opencode-oss/profiles/<id>.yaml.
#
# To copy it by hand (kebab-case id, your endpoint host, your credential
# environment variable):
#   cp opencode-oss/providers/template.yaml /tmp/my-provider.yaml
#   # edit /tmp/my-provider.yaml, then:
#   openshell profile lint -f /tmp/my-provider.yaml
#   openshell profile import -f /tmp/my-provider.yaml --global
#
# The profile authorizes only /usr/local/bin/opencode (the path used by
# opencode-oss/image) to reach api.example.com, and binds EXAMPLE_API_KEY to
# that endpoint.

id: example-provider
display_name: Example Provider
description: Example inference API for the OpenCode coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Example API key
    env_vars: [EXAMPLE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.example.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/opencode
