# The repository verification gate: the same `make test-all` a maintainer
# runs locally, with a MongoDB service for the oskhs store tests. The shell
# step runs the conformance layer in strict mode as part of `make test-all`,
# so a golden or leak failure fails this job; the conformance suite needs no
# Bun and no extra service. The core step builds the release binary the shell
# suite runs through `bin/osa`, then runs the core's own offline suite; a
# missing cargo or a core failure fails the job and names the suite.
#
# The boundary gate (`make test-boundary`) is deliberately not a job here: it
# needs a reachable OpenShell gateway, a container engine with the project
# image, and a sandbox holding a provider, and it must fail rather than skip
# when they are absent. The decision and the prerequisites are recorded in
# docs/ai/verification/claims.md (`### CI`).
name: test

on:
  push:
  pull_request:

jobs:
  test-all:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OSKHS_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # rustup reads rust-toolchain.toml and installs the pinned toolchain (and
      # its clippy/rustfmt components), so the version lives in one place.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install shell suite tools
        run: sudo apt-get update && sudo apt-get install -y fish shellcheck
      - name: Install Bun dependencies
        run: |
          (cd bridge && bun install --frozen-lockfile)
          (cd oskhs && bun install --frozen-lockfile)
          (cd dashboard && bun install)
      - name: make test-all
        run: make test-all
