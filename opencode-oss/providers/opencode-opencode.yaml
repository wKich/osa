# OpenCode + OpenCode Zen provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f opencode-oss/providers/opencode-opencode.yaml
#   openshell profile import -f opencode-oss/providers/opencode-opencode.yaml --global
#
# Then create the provider instance from your host environment:
#   OPENCODE_API_KEY=<key> openshell provider create \
#     --name opencode-opencode --type opencode-opencode --from-existing
#
# The profile authorizes only /usr/local/bin/opencode (the path used by
# opencode-oss/image) to reach opencode.ai, and binds OPENCODE_API_KEY to
# that endpoint. For the Opencode Go endpoint use opencode-opencode-go.yaml
# instead. Do not set OPENCODE_BASE_URL in the sandbox: a different base URL
# would leave the credential unbound.

id: opencode-opencode
display_name: OpenCode (OpenCode Zen)
description: OpenCode Zen inference API for the OpenCode coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: OpenCode API key
    env_vars: [OPENCODE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: opencode.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/opencode
