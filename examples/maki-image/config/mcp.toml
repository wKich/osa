# Global MCP config for the sandbox base image
# (/sandbox/.config/maki/mcp.toml). Copied by examples/maki-image/Dockerfile.
#
# The base image declares no MCP servers: a server is a personal environment
# choice, so it belongs in an environment image built FROM this base. See
# examples/environments/reference/ and docs/ai/environment-playbook.md. Keep
# this file comments-only; it exists so the config path is present.
#
# An environment store's mcp.toml carries the servers. HTTP servers need only
# their endpoint reachable through their provider profile. Stdio servers (a
# `command` array) must also have their runtime and package in the environment
# image: install them at image build as uid 1500, so a session resolves the
# installed files only and never fetches from a registry (egress stays
# deny-by-default; no npm endpoint is in any policy). The helper never installs
# anything into a running sandbox — adding or changing a server means rebuilding
# the environment image, which is what `maki-oss mcp status` reports when the
# runtime or config is missing.
#
# Headers and environment values expand ${VAR} from the sandbox environment.
# OpenShell injects each var as an opaque placeholder from the attached
# provider profile (see examples/providers/mcp-*.yaml); the proxy resolves the
# real value only at that profile's endpoint. No credential value is ever
# baked into this file or the image. A server whose variable is unset
# (provider detached) fails with the variable named in its status; the other
# servers still work.
