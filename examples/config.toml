# maki-oss configuration file.
#
# Copy this file to ${XDG_CONFIG_HOME:-$HOME/.config}/maki-oss/config.toml
# and adjust the values. The helper reads it as data: `key = "value"` lines,
# `#` comments, and blank lines. It is never sourced, and an unknown key is a
# hard error. Flags override MAKI_OSS_* environment variables, which override
# this file, which overrides the built-in defaults.
#
# Supported keys (all values are quoted strings):

# Container image for the sandbox. The default is the generic base built by
# `maki-oss image build`: agent runtime and safety baseline, no MCP servers.
# A derived environment image (for example maki-agent:reference, built from
# examples/environments/reference) can be named here; see
# docs/ai/environment-playbook.md.
image = "maki-agent:local"

# Sandbox policy YAML. A relative path is tried against the current directory
# first, then against the helper's repository root.
policy = "examples/policies/maki-minimal.yaml"

# Provider profiles to attach at sandbox creation, comma-separated. Create
# one first with `maki-oss provider setup` (any provider, including keys
# already stored by Maki or OpenCode) or `maki-oss provider add`. The value is
# the provider instance name, for example "maki-anthropic",
# "maki-opencode-go", or a custom id; see examples/providers/ and
# docs/providers.md. No provider is selected by default, so a copied config
# does not pick one person's provider. Example:
# providers = "maki-anthropic"
providers = ""

# Optional default model for sessions and headless runs, in the
# provider/model form (for example "deepseek/deepseek-chat"). The provider id
# is Maki's catalog id, not the OpenShell provider name. Leave empty to let
# Maki's own model picker decide; the --model flag overrides this value.
model = ""

# Interactive TUI for bare `maki-oss` and `maki-oss maki` (MAKI_OSS_TUI
# overrides this file). Leave empty (or unset) for Maki's own TUI, which is
# the default and unchanged. Set "opencode" to run the OpenCode TUI against
# the local opencode-tui-bridge instead: it needs `bun` and the `opencode`
# binary on the host (`maki-oss doctor` checks them in this mode), the
# bridge's session resume flags (--continue/--resume/--session-id) are
# refused, and the rendering has known defects (docs/helper.md, "Known
# limitations"). Any other value is a usage error.
tui = ""

# Stop the sandbox this long after the last session closes, unless a `maki`
# process still runs inside it (MAKI_OSS_IDLE_STOP and --idle-stop override
# this file). Seconds, or with an s, m, or h suffix; the default is 1h, and
# "0" disables the idle stop. The workspace and Maki's sessions survive the
# stop. Example:
# idle_stop = "30m"

# Optional CPU and memory limits passed to `openshell sandbox create`.
cpu = "2"
memory = "4Gi"

# Sandbox name pattern. `{project}` is replaced with the current directory
# name, sanitized to [A-Za-z0-9_.-]. Remove the placeholder to pin one name,
# or override per invocation with --name.
sandbox_name = "maki-{project}"

# Container engine used by `doctor` and `image build`: docker or podman.
engine = "docker"

# In-sandbox project directory used by upload, download, maki, and run.
workdir = "/sandbox/project"

# OpenShell gateway name. Leave unset to use the default gateway; pass
# --gateway to override for a single invocation.
# gateway = "openshell"
