[package]
name = "stub-gateway"
version = "0.1.0"
edition = "2021"
description = "Offline OpenShell gateway for the test suite"
publish = false

[[bin]]
name = "stub-gateway"
path = "src/main.rs"

[dependencies]
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "sync"] }
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[dev-dependencies]
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
sdk-contract-cases = { path = "../sdk-contract-cases" }
