[package]
name = "insandbox-gateway"
version = "0.1.0"
edition = "2021"
description = "Dev-only in-sandbox OpenShell control plane (enforces no isolation or policy)"
publish = false

[[bin]]
name = "insandbox-gateway"
path = "src/main.rs"

[dependencies]
libc = "0.2"
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"

[dev-dependencies]
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
sdk-contract-cases = { path = "../sdk-contract-cases" }
