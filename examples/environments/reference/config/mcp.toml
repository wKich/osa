# Environment MCP config for the reference store
# (/sandbox/.config/maki/mcp.toml). Copied by this store's Dockerfile.
#
# HTTP servers need only their endpoint reachable through their profile.
# Stdio servers (a `command` array) must also have their runtime and package
# in the image: the Dockerfile installs the pinned runtime and pre-installs
# each declared server's package at build as uid 1500, so a session resolves
# the installed files only and never fetches from a registry (egress stays
# deny-by-default; no npm endpoint is in any policy). The helper never installs
# anything into a running sandbox — adding or changing a server here means a
# rebuild of this environment image, which is what `maki-oss mcp status`
# reports when the runtime or config is missing.
#
# Headers and environment values expand ${VAR} from the sandbox environment.
# OpenShell injects each var as an opaque placeholder from the attached
# provider profile (see examples/providers/mcp-*.yaml); the proxy resolves the
# real value only at that profile's endpoint. No credential value is ever
# baked into this file or the image. A server whose variable is unset
# (provider detached) fails with the variable named in its status; the other
# servers still work.

[mcp.context7]
url = "https://mcp.context7.com/mcp"
headers = { CONTEXT7_API_KEY = "${CONTEXT7_API_KEY}" }
enabled = true

# stdio server pre-warmed by the Dockerfile (bun add -g synthetic-search-mcp).
# The package's own bin carries a node shebang and the image ships no node, so
# the entry runs it under the pinned bun binary instead; `command[0]` is the
# name the readiness gate checks in the sandbox (command -v bun). Two variable
# names meet here: the child-facing key stays SYNTHETIC_API_KEY because that
# is what the package reads, while the expansion sources the provider-injected
# MCP_SYNTHETIC_API_KEY — a sandbox can attach only one provider per credential
# key and maki-synthetic owns SYNTHETIC_API_KEY (see
# examples/providers/mcp-synthetic.yaml).
[mcp.synthetic]
command = ["bun", "/sandbox/.bun/install/global/node_modules/synthetic-search-mcp/bin/index.js"]
environment = { SYNTHETIC_API_KEY = "${MCP_SYNTHETIC_API_KEY}" }
enabled = true
